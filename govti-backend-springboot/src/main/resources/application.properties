spring.application.name=govti-backend
server.port=8020

spring.datasource.url=jdbc:mysql://localhost:3306/govti_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:GovtiDemoSecretKeyChangeThisToAtLeast32Characters2026}
app.jwt.expiration-ms=86400000
